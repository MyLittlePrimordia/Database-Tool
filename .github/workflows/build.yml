name: Build Database Tool

# Assumes this repo's layout matches what was shipped: a top-level
# app/ folder containing main.py, db_logic.py, assets/, build_macos.sh,
# and build_linux_appimage.sh. If you flattened the repo (app/*
# directly at the root), remove "working-directory: app" below and
# the "app/" prefix from each artifact "path:".

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

# Needed so the release job can create/overwrite the "latest" release.
permissions:
  contents: write

jobs:
  # F2 -- automated schema-validation & regression suite. Pure-logic
  # tests (no display needed); runs on all three OSes before any build
  # so a broken patch can never ship an artifact.
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest tests -q

  windows:
    name: Windows (.exe)
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build .exe
        run: python -m PyInstaller --onefile --windowed --name "Database Tool" --icon "assets/icon.ico" --add-data "assets;assets" main.py

      - name: Rename to Database-Tool.exe
        run: Move-Item -LiteralPath "dist\Database Tool.exe" -Destination "dist\Database-Tool.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Database-Tool-windows
          path: app/dist/Database-Tool.exe
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    needs: tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Python with Tk via Homebrew
        run: |
          brew install python-tk@3.12
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      # Removed `--upgrade pip` so it installs pyinstaller without trying to overwrite Homebrew's pip
      - name: Install PyInstaller and create-dmg
        run: |
          python3.12 -m pip install pyinstaller --break-system-packages
          brew install create-dmg

      - name: Verify tkinter is available
        run: python3.12 -c "import tkinter; print('tkinter OK')"

      - name: Build .app and .dmg
        run: |
          chmod +x build_macos.sh
          PYTHON=python3.12 ./build_macos.sh

      - name: Rename to Database-Tool.dmg (only file kept)
        run: |
          mv -f "dist/Database_Tool.dmg" "dist/Database-Tool.dmg"
          rm -rf build "Database Tool.spec" "dist/Database Tool.app"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Database-Tool-macos
          path: app/dist/Database-Tool.dmg
          if-no-files-found: error

  linux:
    name: Linux (.AppImage)
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tkinter + AppImage extraction support)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build AppImage
        run: |
          chmod +x build_linux_appimage.sh
          ./build_linux_appimage.sh

      - name: Rename to Database-Tool.appimage (only file kept)
        run: |
          mv -f "dist/Database_Tool.AppImage" "dist/Database-Tool.appimage"
          rm -rf build AppDir Database_Tool.spec appimagetool.AppImage "dist/Database_Tool"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Database-Tool-linux
          path: app/dist/Database-Tool.appimage
          if-no-files-found: error

  release:
    name: Publish latest release (raw binaries, no zip)
    needs: [windows, macos, linux]
    # Builds run on every push/PR, but only pushes to main/master (plus
    # v* tags and manual runs) overwrite the rolling "latest" release.
    # To release from ANY branch push instead, replace this with:
    #   if: github.event_name != 'pull_request'
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files (and restore AppImage exec bit)
        run: |
          chmod +x dist/Database-Tool.appimage || true
          ls -lh dist

      - name: Overwrite "latest" release with raw files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Rolling build of Database Tool — overwritten on every push to main.

            Raw binaries, no zip:
            - `Database-Tool.exe` (Windows)
            - `Database-Tool.dmg` (macOS)
            - `Database-Tool.appimage` (Linux)

            Commit: ${{ github.sha }}
          make_latest: true
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/Database-Tool.exe
            dist/Database-Tool.dmg
            dist/Database-Tool.appimage
